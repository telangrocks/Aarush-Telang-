name = "crypto-pulse-backend"
main = "src/index.ts"
# 2024-09-23: first date where bare `crypto` (without `node:` prefix) resolves
# to the Node.js built-in in the Workers runtime.
compatibility_date = "2024-09-23"
# Enable Node.js built-ins (crypto, stream, etc.) required by bignumber.js and backend utilities.
compatibility_flags = ["nodejs_compat"]
# Pin the account so Wrangler does not call /memberships to auto-discover it.
# Narrowly scoped API tokens cannot list memberships, which otherwise fails
# `wrangler deploy` with "Authentication error [code: 10000]".
account_id = "0ea8292ec77cc8fabb1bdc1b73127a19"
# Skip Wrangler telemetry network calls in CI.
send_metrics = false

# Explicit Frankfurt placement to ensure Worker executes in EU (bypasses Bybit CloudFront US geo-block)
[placement]
region = "aws:eu-central-1"

# Workers AI binding — used to call Moonshot AI "Kimi K3" (moonshotai/kimi-k3)
# via env.AI.run(...). Workers AI is enabled on all Cloudflare plans by default.
[ai]
binding = "AI"

# Bind D1 Database
[[d1_databases]]
binding = "DB"
database_name = "crypto_pulse_db"
database_id = "15f49e2f-08bf-4dc5-8ec5-0860429fc0c4"
preview_database_id = "15f49e2f-08bf-4dc5-8ec5-0860429fc0c4"
# Location of the D1 schema migration files applied via `wrangler d1 migrations apply`.
migrations_dir = "migrations"

[durable_objects]
bindings = [{ name = "TRADING_BOTS", class_name = "TradingBot" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["TradingBot"]

# Explicitly clear any orphan cron schedules to prevent scheduled() handler exceptions
[triggers]
crons = []

# Plain-text environment variables
[vars]
ENVIRONMENT = "production"
