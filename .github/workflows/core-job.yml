name: Core Validation Workflow

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/**"

concurrency:
  group: core-job-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  core-validation-pipeline:
    name: End-to-End Core Validation (24 Steps)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build backend
        run: npm run build

      - name: Run Core Validation Pipeline (24 Steps)
        run: npx tsx scripts/core-validation.ts
