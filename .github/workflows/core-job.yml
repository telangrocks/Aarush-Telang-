name: Production Validation Pipeline

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Validation Level"
        required: true
        default: "level1_public"
        type: choice
        options:
          - level1_public
          - level2_testnet
          - level3_prod_smoke
      exchange:
        description: "Exchange (leave blank for level default: Level 1/2/3 → bybit)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - bybit
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/**"

concurrency:
  group: core-job-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  production-validation:
    name: Production Validation Framework (All Exchanges)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build backend
        run: npm run build

      - name: Run Production Validation Pipeline
        env:
          WORKER_URL: "https://crypto-pulse-backend.telangrocks.workers.dev"
          VALIDATION_EXCHANGE: ${{ inputs.exchange || '' }}
          # ── Binance credentials ─────
          BINANCE_MAINNET_API_KEY:    ${{ secrets.BINANCE_MAINNET_API_KEY }}
          BINANCE_MAINNET_API_SECRET: ${{ secrets.BINANCE_MAINNET_API_SECRET }}
          BINANCE_TESTNET_API_KEY:    ${{ secrets.BINANCE_TESTNET_API_KEY }}
          BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
          # ── Bybit credentials ───────
          BYBIT_MAINNET_API_KEY:      ${{ secrets.BYBIT_MAINNET_API_KEY }}
          BYBIT_MAINNET_API_SECRET:   ${{ secrets.BYBIT_MAINNET_API_SECRET }}
          BYBIT_TESTNET_API_KEY:      ${{ secrets.BYBIT_TESTNET_API_KEY }}
          BYBIT_TESTNET_API_SECRET:   ${{ secrets.BYBIT_TESTNET_API_SECRET }}
          # ── KuCoin credentials ──────
          KUCOIN_MAINNET_API_KEY:        ${{ secrets.KUCOIN_MAINNET_API_KEY }}
          KUCOIN_MAINNET_API_SECRET:     ${{ secrets.KUCOIN_MAINNET_API_SECRET }}
          KUCOIN_MAINNET_API_PASSPHRASE: ${{ secrets.KUCOIN_MAINNET_API_PASSPHRASE }}
        run: |
          LEVEL="${{ inputs.level || 'level1_public' }}"
          npx tsx scripts/validation/runner.ts --level=$LEVEL --outDir=reports

      - name: Assert KuCoin Testnet Deprecation Handling
        run: |
          npx vitest run src/infrastructure/exchange/Adapters.test.ts

      - name: Upload Validation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: backend/reports/

