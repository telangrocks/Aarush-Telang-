name: Production Validation Pipeline

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Validation Level"
        required: true
        default: "level1_public"
        type: choice
        options:
          - level1_public
          - level2_testnet
          - level3_prod_smoke
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/**"

concurrency:
  group: core-job-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  production-validation:
    name: Production Validation Framework (11 Phases)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build backend
        run: npm run build

      - name: Run Production Validation Pipeline
        env:
          WORKER_URL: "https://crypto-pulse-backend.telangrocks.workers.dev"
          EXCHANGE_API_KEY: ${{ secrets.QA_EXCHANGE_API_KEY }}
          EXCHANGE_API_SECRET: ${{ secrets.QA_EXCHANGE_API_SECRET }}
          EXCHANGE_PASSPHRASE: ${{ secrets.QA_EXCHANGE_PASSPHRASE }}
        run: |
          LEVEL="${{ inputs.level || 'level1_public' }}"
          npx tsx scripts/validation/runner.ts --level=$LEVEL --outDir=reports

      - name: Upload Validation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: backend/reports/
