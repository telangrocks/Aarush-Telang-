name: Production Validation Pipeline

on:
  workflow_dispatch:
    inputs:
      level:
        description: "Validation Level"
        required: true
        default: "level1_public"
        type: choice
        options:
          - level1_public
          - level2_testnet
          - level3_prod_smoke
      exchange:
        description: "Exchange (leave blank for level default: Level 1/2 → binance, Level 3 → kucoin)"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - binance
          - kucoin
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/**"

concurrency:
  group: core-job-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  production-validation:
    name: Production Validation Framework (11 Phases)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build backend
        run: npm run build

      - name: Run Production Validation Pipeline
        env:
          WORKER_URL: "https://crypto-pulse-backend.telangrocks.workers.dev"
          # Exchange selection — optional override. When blank, ExchangeRegistry level defaults apply:
          #   level1_public     → binance (mainnet, public endpoints only)
          #   level2_testnet    → binance (testnet)
          #   level3_prod_smoke → kucoin  (mainnet, read-only)
          VALIDATION_EXCHANGE: ${{ inputs.exchange || '' }}
          # ── Binance Testnet credentials (Level 2 / BINANCE_TESTNET_* prefix) ─────
          BINANCE_TESTNET_API_KEY:    ${{ secrets.BINANCE_TESTNET_API_KEY }}
          BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
          # ── KuCoin Mainnet credentials (Level 3 / KUCOIN_MAINNET_* prefix) ───────
          KUCOIN_MAINNET_API_KEY:          ${{ secrets.KUCOIN_MAINNET_API_KEY }}
          KUCOIN_MAINNET_API_SECRET:       ${{ secrets.KUCOIN_MAINNET_API_SECRET }}
          KUCOIN_MAINNET_API_PASSPHRASE:   ${{ secrets.KUCOIN_MAINNET_API_PASSPHRASE }}
          # ── Future exchanges: add secrets + input options; no engine code changes ─
          # BYBIT_TESTNET_API_KEY:    ${{ secrets.BYBIT_TESTNET_API_KEY }}
          # BYBIT_TESTNET_API_SECRET: ${{ secrets.BYBIT_TESTNET_API_SECRET }}
        run: |
          LEVEL="${{ inputs.level || 'level1_public' }}"
          npx tsx scripts/validation/runner.ts --level=$LEVEL --outDir=reports

      - name: Upload Validation Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports
          path: backend/reports/

