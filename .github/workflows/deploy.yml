name: Deploy backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/**"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/**"

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  actions: write

env:
  CLOUDFLARE_ACCOUNT_ID: "0ea8292ec77cc8fabb1bdc1b73127a19"

jobs:
  deploy-backend:
    name: Build and deploy backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --run

      - name: Verify Cloudflare API token
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_WORKERS_API_TOKEN is required"; exit 1; }

      # The following steps deploy to production and run on pushes to
      # main or manual workflow_dispatch triggers. Pull requests run only
      # the lint/build/test gate above without touching live services.
      - name: Apply D1 migrations (remote)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "0ea8292ec77cc8fabb1bdc1b73127a19"
        run: npx wrangler d1 migrations apply crypto_pulse_db --config wrangler.toml --remote

      - name: Show D1 migration status
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "0ea8292ec77cc8fabb1bdc1b73127a19"
      - name: Run Mandatory Live Exchange Pre-Deployment Gate
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          WORKER_URL: "https://crypto-pulse-backend.telangrocks.workers.dev"
          BINANCE_MAINNET_API_KEY: ${{ secrets.BINANCE_MAINNET_API_KEY }}
          BINANCE_MAINNET_API_SECRET: ${{ secrets.BINANCE_MAINNET_API_SECRET }}
          BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
          BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
          BYBIT_MAINNET_API_KEY: ${{ secrets.BYBIT_MAINNET_API_KEY }}
          BYBIT_MAINNET_API_SECRET: ${{ secrets.BYBIT_MAINNET_API_SECRET }}
          BYBIT_TESTNET_API_KEY: ${{ secrets.BYBIT_TESTNET_API_KEY }}
          BYBIT_TESTNET_API_SECRET: ${{ secrets.BYBIT_TESTNET_API_SECRET }}
          KUCOIN_MAINNET_API_KEY: ${{ secrets.KUCOIN_MAINNET_API_KEY }}
          KUCOIN_MAINNET_API_SECRET: ${{ secrets.KUCOIN_MAINNET_API_SECRET }}
          KUCOIN_MAINNET_API_PASSPHRASE: ${{ secrets.KUCOIN_MAINNET_API_PASSPHRASE }}
        run: |
          npx tsx scripts/validation/runner.ts --level=level1_public --outDir=reports
          npx vitest run src/infrastructure/exchange/Adapters.test.ts

      - name: Deploy Worker
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "0ea8292ec77cc8fabb1bdc1b73127a19"
        run: npx wrangler deploy --config wrangler.toml

      - name: Set JWT_SECRET
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -n "$JWT_SECRET" ]; then
            echo "$JWT_SECRET" | npx wrangler secret put JWT_SECRET --config wrangler.toml
          else
            echo "JWT_SECRET not set in GitHub Secrets, skipping remote secret update."
          fi

      - name: Set ENCRYPTION_KEY
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
        run: |
          if [ -n "$ENCRYPTION_KEY" ]; then
            echo "$ENCRYPTION_KEY" | npx wrangler secret put ENCRYPTION_KEY --config wrangler.toml
          else
            echo "ENCRYPTION_KEY not set in GitHub Secrets, skipping remote secret update."
          fi

      - name: Set RESEND_API_KEY
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            echo "$RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --config wrangler.toml
          else
            echo "RESEND_API_KEY not set in GitHub Secrets, skipping remote secret update."
          fi

      - name: Set ALLOWED_ORIGINS
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          ALLOWED_ORIGINS: ${{ secrets.ALLOWED_ORIGINS }}
        run: |
          if [ -n "$ALLOWED_ORIGINS" ]; then
            echo "$ALLOWED_ORIGINS" | npx wrangler secret put ALLOWED_ORIGINS --config wrangler.toml
          else
            echo "ALLOWED_ORIGINS not set in GitHub Secrets, skipping remote secret update."
          fi

      - name: Set FCM server key
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          FCM_SERVER_KEY: ${{ secrets.FCM_SERVER_KEY }}
        run: |
          if [ -n "$FCM_SERVER_KEY" ]; then
            echo "$FCM_SERVER_KEY" | npx wrangler secret put FCM_SERVER_KEY --config wrangler.toml
          else
            echo "FCM_SERVER_KEY not set in GitHub Secrets, skipping remote secret update."
          fi

      - name: Set FCM v1 Project ID
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
        run: |
          if [ -n "$FCM_PROJECT_ID" ]; then
            echo "$FCM_PROJECT_ID" | npx wrangler secret put FCM_PROJECT_ID --config wrangler.toml
          else
            echo "FCM_PROJECT_ID not set in GitHub Secrets, skipping remote secret update."
          fi

      - name: Set FCM v1 Client Email
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          FCM_CLIENT_EMAIL: ${{ secrets.FCM_CLIENT_EMAIL }}
        run: |
          if [ -n "$FCM_CLIENT_EMAIL" ]; then
            echo "$FCM_CLIENT_EMAIL" | npx wrangler secret put FCM_CLIENT_EMAIL --config wrangler.toml
          else
            echo "FCM_CLIENT_EMAIL not set in GitHub Secrets, skipping remote secret update."
          fi

      - name: Set FCM v1 Private Key
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}
          FCM_PRIVATE_KEY: ${{ secrets.FCM_PRIVATE_KEY }}
        run: |
          if [ -n "$FCM_PRIVATE_KEY" ]; then
            echo "$FCM_PRIVATE_KEY" | npx wrangler secret put FCM_PRIVATE_KEY --config wrangler.toml
          else
            echo "FCM_PRIVATE_KEY not set in GitHub Secrets, skipping remote secret update."
          fi

      - name: Post-Deploy Live Worker Exchange Certification
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          WORKER_URL: https://crypto-pulse-backend.telangrocks.workers.dev
          CLOUDFLARE_ACCOUNT_ID: "0ea8292ec77cc8fabb1bdc1b73127a19"
          BINANCE_MAINNET_API_KEY: ${{ secrets.BINANCE_MAINNET_API_KEY }}
          BINANCE_MAINNET_API_SECRET: ${{ secrets.BINANCE_MAINNET_API_SECRET }}
          BINANCE_TESTNET_API_KEY: ${{ secrets.BINANCE_TESTNET_API_KEY }}
          BINANCE_TESTNET_API_SECRET: ${{ secrets.BINANCE_TESTNET_API_SECRET }}
          BYBIT_MAINNET_API_KEY: ${{ secrets.BYBIT_MAINNET_API_KEY }}
          BYBIT_MAINNET_API_SECRET: ${{ secrets.BYBIT_MAINNET_API_SECRET }}
          BYBIT_TESTNET_API_KEY: ${{ secrets.BYBIT_TESTNET_API_KEY }}
          BYBIT_TESTNET_API_SECRET: ${{ secrets.BYBIT_TESTNET_API_SECRET }}
          KUCOIN_MAINNET_API_KEY: ${{ secrets.KUCOIN_MAINNET_API_KEY }}
          KUCOIN_MAINNET_API_SECRET: ${{ secrets.KUCOIN_MAINNET_API_SECRET }}
          KUCOIN_MAINNET_API_PASSPHRASE: ${{ secrets.KUCOIN_MAINNET_API_PASSPHRASE }}
        run: |
          npx tsx scripts/validation/runner.ts --level=level1_public --outDir=reports_deployed
          npx tsx scripts/validation/runner.ts --level=level1_public --exchange=bybit --outDir=reports_deployed_bybit

      - name: Upload Post-Deployment Certification Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: post-deploy-certification-artifacts
          path: |
            backend/reports_deployed/
            backend/reports_deployed_bybit/
