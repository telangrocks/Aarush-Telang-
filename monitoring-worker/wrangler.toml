name = "cryptopulse-monitoring-worker"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
account_id = "0ea8292ec77cc8fabb1bdc1b73127a19"
send_metrics = false

# ---------------------------------------------------------------------------
# FREE-PLAN, QUEUE-FREE ARCHITECTURE
# Telemetry arrives ONLY via the Worker-to-Worker service binding
# (backend MONITOR_INGEST_SERVICE -> POST /internal/ingest) scheduled inside the
# producer's ctx.waitUntil(). Delivery is best-effort and NOT durable.
# No Cloudflare Queues, no DLQ, no Tail Workers, no paid add-ons.
# ---------------------------------------------------------------------------

# Strictly isolated monitoring D1 database (never bind crypto_pulse_db).
# Top-level (production) monitoring DB is intentionally NOT provisioned yet.
[[d1_databases]]
binding = "MONITORING_DB"
database_name = "crypto_pulse_monitoring_db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[triggers]
crons = ["0 */6 * * *"]

[vars]
ENVIRONMENT = "production"
REQUIRE_INTERNAL_SECRET = "true"
ALLOWED_ORIGINS = "https://cryptopulse-monitoring.pages.dev,http://localhost:3000,http://localhost:8788,http://127.0.0.1:8788"

# ---------------------------------------------------------------------------
# ISOLATED STAGING (Cloudflare Free plan only)
# Secrets (wrangler secret put --env staging): JWT_SECRET, ADMIN_API_KEY,
# INTERNAL_INGEST_SECRET. Staging values are unique and never shared with production.
# ---------------------------------------------------------------------------
[env.staging]
name = "cryptopulse-monitoring-worker-staging"
workers_dev = true

[[env.staging.d1_databases]]
binding = "MONITORING_DB"
database_name = "crypto_pulse_monitoring_db_staging"
database_id = "d4524498-cb4b-484b-95c0-a3cfa740541f"
migrations_dir = "migrations"

[env.staging.triggers]
crons = ["0 */6 * * *"]

[env.staging.vars]
ENVIRONMENT = "testnet"
REQUIRE_INTERNAL_SECRET = "true"
ALLOWED_ORIGINS = "https://staging.cryptopulse-monitoring.pages.dev,http://localhost:8788,http://127.0.0.1:8788"

# Read-only live-state probe into the STAGING backend only (never production).
[[env.staging.services]]
binding = "BACKEND_SERVICE"
service = "crypto-pulse-backend-staging"
