<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="60%" stop-color="#070A12" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <linearGradient id="borderGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="cyanGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>

    <linearGradient id="indigoGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <radialGradient id="glowCircle2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad2)" stroke="url(#borderGrad2)" stroke-width="2.5" />
  <circle cx="256" cy="256" r="180" fill="url(#glowCircle2)" />

  <!-- Candlestick System with Integrated Dynamic Pulse -->
  <g transform="translate(256, 256)">
    <!-- Column 1 (Left Support) -->
    <line x1="-90" y1="-70" x2="-90" y2="110" stroke="#334155" stroke-width="5" stroke-linecap="round" />
    <rect x="-106" y="-30" width="32" height="90" rx="8" fill="#1E293B" stroke="#475569" stroke-width="2" />

    <!-- Column 2 (Middle Upward Signal) -->
    <line x1="-10" y1="-120" x2="-10" y2="90" stroke="#38BDF8" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    <rect x="-26" y="-80" width="32" height="120" rx="8" fill="url(#indigoGrad2)" />

    <!-- Column 3 (Right Alpha Breakout) -->
    <line x1="70" y1="-150" x2="70" y2="50" stroke="#00F5D4" stroke-width="5" stroke-linecap="round" />
    <rect x="54" y="-120" width="32" height="130" rx="8" fill="url(#cyanGrad2)" filter="url(#softGlow2)" />

    <!-- Precision Laser Pulse Slicing Across -->
    <path d="M -160 30 L -90 30 L -50 -40 L -10 45 L 30 -90 L 70 -60 L 110 -130 L 160 -130"
          fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#softGlow2)" />
    
    <!-- Neon Pulse Halo -->
    <path d="M -160 30 L -90 30 L -50 -40 L -10 45 L 30 -90 L 70 -60 L 110 -130 L 160 -130"
          fill="none" stroke="#00F5D4" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" opacity="0.4" filter="url(#softGlow2)" />

    <!-- Breakout Apex Star/Node -->
    <circle cx="110" cy="-130" r="10" fill="#FFFFFF" filter="url(#softGlow2)" />
    <circle cx="110" cy="-130" r="5" fill="#00D2FF" />
  </g>
</svg>